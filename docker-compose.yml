# Local Postgres for development and tests (production stays on its hosted database).
# Start: pnpm db:up   Stop: docker compose down   (data persists in the sava-pg volume)
services:
  postgres:
    image: postgres:17-alpine
    container_name: sava-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sava
      POSTGRES_PASSWORD: sava
      POSTGRES_DB: sava_dev
    ports:
      - "127.0.0.1:5432:5432" # local machine only
    volumes:
      - sava-pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sava -d sava_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  sava-pg:
